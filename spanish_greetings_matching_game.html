<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Los Saludos | Matching Game</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#173456;background:#f0f5fc}*{box-sizing:border-box}body{margin:0;padding:28px 14px}.app{max-width:850px;margin:auto;background:white;border-radius:24px;padding:clamp(18px,4vw,38px);box-shadow:0 12px 32px #1e47751c}header{text-align:center}h1{margin:0;color:#153d70;font-size:clamp(26px,5vw,38px)}.sub{color:#59708a;margin:10px 0 22px}.stats{display:flex;justify-content:space-between;align-items:center;background:#eaf1fb;padding:12px 18px;border-radius:12px;font-weight:bold;gap:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}.column{display:flex;flex-direction:column;gap:11px}.column h2{font-size:17px;text-align:center;margin:0 0 4px}.tile{min-height:72px;border:2px solid #c9d7e8;border-radius:14px;background:#fff;color:#173456;font-size:clamp(14px,2.5vw,19px);font-weight:700;cursor:pointer;padding:12px 8px;transition:background .15s,border-color .15s}.tile:hover:not(:disabled),.tile:focus-visible{border-color:#245c9a;background:#f0f6ff}.tile.selected{background:#dbeafe;border-color:#1d63ad;box-shadow:0 0 0 2px #1d63ad22}.tile.matched{background:#dff6e7;border-color:#2a9b59;color:#17663b;cursor:default}.tile.wrong{background:#ffe8e8;border-color:#c64d4d}.feedback{text-align:center;min-height:48px;margin:22px 0 8px;font-size:17px;font-weight:bold}button.reset{display:block;margin:0 auto;background:#174f90;color:white;border:0;border-radius:12px;padding:14px 28px;font-size:16px;font-weight:bold;cursor:pointer}.note{text-align:center;color:#6b7e93;font-size:13px;margin:20px 0 0}@media(max-width:480px){.app{padding:18px 12px}.grid{gap:9px}.tile{min-height:74px}.stats{font-size:13px;padding:12px}}
</style>
</head>
<body><main class="app"><header><h1>👋 Los Saludos</h1><p class="sub">Match the Spanish greeting with its English meaning.</p></header><div class="stats"><span id="progress">Matches: 0 / 5</span><span id="attempts">Incorrect attempts: 0</span></div><div class="grid"><section class="column" id="spanish"><h2>🇪🇸 Spanish</h2></section><section class="column" id="english"><h2>🇬🇧 English</h2></section></div><div class="feedback" id="feedback" role="status" aria-live="polite">Choose a Spanish greeting to start!</div><button class="reset" id="reset">↻ Play Again</button><p class="note">Practice activity • Your score stays on this page and is not sent to a teacher.</p></main>
<script>
const items=[{es:'¡Hola!',en:'Hello'},{es:'Buenos días',en:'Good morning'},{es:'Buenas tardes',en:'Good afternoon'},{es:'Hasta luego',en:'See you later'},{es:'Adiós',en:'Goodbye'}];
let selected=null,matched=new Set(),wrong=0,locked=false;
const $=id=>document.getElementById(id);
function shuffle(a){const out=[...a];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}
function button(item,side){const b=document.createElement('button');b.type='button';b.className='tile';b.textContent=side==='es'?item.es:item.en;b.dataset.id=items.indexOf(item);b.dataset.side=side;b.addEventListener('click',()=>choose(b));return b;}
function update(){ $('progress').textContent=`Matches: ${matched.size} / 5`; $('attempts').textContent=`Incorrect attempts: ${wrong}`; }
function reset(){selected=null;matched=new Set();wrong=0;locked=false;for(const side of ['spanish','english']){const el=$(side);el.querySelectorAll('button').forEach(b=>b.remove());}items.forEach(item=>$('spanish').appendChild(button(item,'es')));shuffle(items).forEach(item=>$('english').appendChild(button(item,'en')));$('feedback').textContent='Choose a Spanish greeting to start!';update();}
function choose(b){if(locked||b.disabled)return;if(!selected){if(b.dataset.side!=='es'){$('feedback').textContent='Choose a Spanish greeting first.';return;}selected=b;b.classList.add('selected');$('feedback').textContent='Now choose the English meaning.';return;}
if(b===selected){b.classList.remove('selected');selected=null;$('feedback').textContent='Choose a Spanish greeting to start!';return;}
if(b.dataset.side==='es'){selected.classList.remove('selected');selected=b;b.classList.add('selected');return;}
const first=selected;selected=null;first.classList.remove('selected');if(first.dataset.id===b.dataset.id){matched.add(Number(b.dataset.id));first.classList.add('matched');b.classList.add('matched');first.disabled=true;b.disabled=true;$('feedback').textContent=matched.size===items.length?'🎉 ¡Excelente! You matched all five greetings!':'✓ ¡Muy bien! Correct match!';update();}else{wrong++;update();locked=true;first.classList.add('wrong');b.classList.add('wrong');$('feedback').textContent='Not quite — try again!';setTimeout(()=>{first.classList.remove('wrong');b.classList.remove('wrong');locked=false;},650);}}
$('reset').addEventListener('click',reset);reset();
</script></body></html>
